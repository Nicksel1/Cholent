<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cholent &amp; Chill — Something big is cooking</title>
<meta name="description" content="Something big is cooking at Cholent & Chill. Leave your email and be the first to know when it's served." />
<meta property="og:title" content="Cholent & Chill — Something big is cooking" />
<meta property="og:description" content="Be the first to know when it's served." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#0c0c0a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c0c0a; --surface: #141412; --border: #2a2a26; --border-strong: #3a3a33;
    --accent: #e8a030; --accent-hover: #f2b551; --accent-ink: #120d04;
    --text: #f0ede8; --muted: #8f8b82; --ok: #9ccc65;
    --radius: 12px; --radius-pill: 999px;
    --dur: 200ms; --ease: cubic-bezier(.22,1,.36,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh; display: flex; flex-direction: column;
    font-family: "DM Sans", system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.55;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  /* soft warm glow behind the headline, same as the main site's hero */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 55% 40% at 50% 42%, rgba(232,160,48,.13) 0%, transparent 70%);
  }
  :focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 3px; border-radius: 6px; }

  header { position: relative; padding: 28px 24px 0; text-align: center; }
  .wordmark { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .wordmark span { color: var(--accent); }

  main { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; }
  .eyebrow { font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px; }
  h1 { font-family: "Syne", sans-serif; font-weight: 800; font-size: clamp(2.4rem, 10.5vw, 6.5rem); line-height: .95; letter-spacing: -0.04em; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 22px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.15rem); max-width: 38ch; }

  form { margin-top: 40px; width: 100%; max-width: 460px; }
  .field { display: flex; gap: 6px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); transition: border-color var(--dur); }
  .field:focus-within { border-color: var(--border-strong); }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-size: 1rem; padding: 0 16px; }
  .field input::placeholder { color: var(--muted); }
  .field button { flex: none; height: 48px; padding: 0 22px; border: 0; border-radius: var(--radius-pill); background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 500; font-size: .95rem; cursor: pointer; transition: background var(--dur); }
  .field button:hover { background: var(--accent-hover); }
  .field button:disabled { opacity: .6; cursor: wait; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .note { margin-top: 12px; min-height: 1.5em; font-size: .85rem; color: var(--muted); }
  .note.ok { color: var(--ok); }
  .note.err { color: #ef8a7a; }
  form.done .field { display: none; }
  form.done .note { font-size: 1.05rem; }

  footer { position: relative; padding: 0 24px 36px; text-align: center; }
  .find { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .socials { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; list-style: none; }
  .socials a { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--text); text-decoration: none; font-size: .9rem; transition: border-color var(--dur), color var(--dur); }
  .socials a:hover { border-color: var(--accent); color: var(--accent); }
  .socials svg { width: 18px; height: 18px; flex: none; }
  .copy { margin-top: 22px; font-size: .78rem; color: #5e5b54; }

  .rise { opacity: 0; transform: translateY(16px); animation: rise .8s var(--ease) forwards; }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    .field { flex-direction: column; border-radius: 18px; padding: 8px; }
    .field input { height: 46px; text-align: center; }
    .field button { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">Cholent <span>&amp; Chill</span></a>
</header>

<main>
  <p class="eyebrow rise">Coming soon</p>
  <h1 class="rise d1">Something big<br />is <em>cooking.</em></h1>
  <p class="sub rise d2">It's been simmering for a while. Leave your email and you'll be the first to know when it's served.</p>

  <!--
    Netlify Forms: when this page is hosted on Netlify, every submission is saved
    under Site → Forms → "notify" in the Netlify dashboard (exportable as CSV).
  -->
  <form class="rise d3" name="notify" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" id="notify-form">
    <input type="hidden" name="form-name" value="notify" />
    <p class="hp"><label>Don't fill this in: <input name="bot-field" tabindex="-1" autocomplete="off" /></label></p>
    <div class="field">
      <label for="email" class="hp">Email address</label>
      <input id="email" type="email" name="email" placeholder="Your email address" autocomplete="email" required />
      <button type="submit">Notify me</button>
    </div>
    <p class="note" id="note" role="status" aria-live="polite">No spam. Just one email when it's ready.</p>
  </form>
</main>

<footer class="rise d4">
  <p class="find">Find Cholent &amp; Chill now</p>
  <ul class="socials" id="socials"></ul>
  <p class="copy">© <span id="yr">2026</span> Cholent &amp; Chill</p>
</footer>

<script>
  // ── YOUR LINKS ─────────────────────────────────────────
  // Paste your Facebook page and WhatsApp (channel / group / wa.me) links below.
  // Any link left empty is hidden.
  const LINKS = {
    instagram: "https://www.instagram.com/cholent.and.chill/",
    youtube:   "https://www.youtube.com/@cholentandchill",
    facebook:  "",
    whatsapp:  "",
  };

  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    youtube:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.75 15.1V8.9L15.5 12l-5.75 3.1Z"/></svg>',
    facebook:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21h3.1Z"/></svg>',
    whatsapp:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>',
  };
  const LABELS = { instagram: "Instagram", youtube: "YouTube", facebook: "Facebook", whatsapp: "WhatsApp" };

  const list = document.getElementById("socials");
  ["instagram", "youtube", "facebook", "whatsapp"].forEach(k => {
    if (!LINKS[k]) return;
    const li = document.createElement("li");
    li.innerHTML = `<a href="${LINKS[k]}" target="_blank" rel="noopener">${ICONS[k]}<span>${LABELS[k]}</span></a>`;
    list.appendChild(li);
  });
  document.getElementById("yr").textContent = new Date().getFullYear();

  // ── SIGN-UP (submits to Netlify Forms without leaving the page) ─────
  const form = document.getElementById("notify-form");
  const note = document.getElementById("note");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    note.className = "note"; note.textContent = "Saving…";
    try {
      const res = await fetch("/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(new FormData(form)).toString(),
      });
      if (!res.ok) throw new Error(res.status);
      form.classList.add("done");
      note.className = "note ok";
      note.textContent = "You're on the list. We'll let you know the moment it's served. 🍲";
    } catch (err) {
      note.className = "note err";
      note.textContent = "Something went wrong. Please try again in a moment.";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
